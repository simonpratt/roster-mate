<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roster Mate — Calendar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E1014; color: #ECEEF2; color-scheme: dark; font-family: 'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px 8px">
    <svg width="30" height="30" viewBox="0 0 30 30" role="img" aria-label="Roster Mate">
      <rect x="1" y="1" width="28" height="28" rx="8" fill="#161920" stroke="#2A2F38"></rect>
      <rect x="7" y="7" width="7" height="7" rx="2" fill="#FCC35A"></rect>
      <rect x="16" y="7" width="7" height="7" rx="2" fill="#7DD3FC"></rect>
      <rect x="7" y="16" width="7" height="7" rx="2" fill="#C9B6FD"></rect>
      <rect x="16" y="16" width="7" height="7" rx="2" fill="none" stroke="#5A616D" stroke-width="1.5"></rect>
    </svg>
    <div style="display: flex; align-items: center; gap: 8px">
      <p aria-label="Sync status: {{syncLabel}}" style="margin: 0; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 16px; background: #161920; border: 1px solid #23272F; font-size: 13px; font-weight: 500; color: #C9CDD4; box-sizing: border-box">
        <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: {{syncDot}}; box-shadow: inset 0 0 0 1.5px {{syncRing}}"></span>
        <span>{{syncLabel}}</span>
      </p>
      <a href="Import.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px 0 14px; border-radius: 12px; background: #ECEEF2; color: #0E1014; font-weight: 600; font-size: 15px; text-decoration: none; box-sizing: border-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
        Import
      </a>
    </div>
  </header>

  <sc-if value="{{showBanner}}" hint-placeholder-val="{{ false }}">
    <div style="margin: 4px 16px 4px; padding: 10px 10px 10px 14px; border-radius: 14px; background: #2A1418; border: 1px solid #4A1F27; display: flex; align-items: center; gap: 12px">
      <p style="margin: 0; flex: 1; font-size: 14px; line-height: 1.4; color: #FBD5DB">Sign in to sync. Your edits are kept on this phone until then.</p>
      <a href="Login.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 10px; background: #FB7185; color: #1A0A0D; font-weight: 600; font-size: 15px; text-decoration: none; box-sizing: border-box">Sign in</a>
    </div>
  </sc-if>

  <section aria-labelledby="next-shift" style="padding: 16px 16px 20px">
    <p style="margin: 0; font-size: 13px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: #9AA1AD">Next shift</p>
    <div style="display: flex; align-items: center; gap: 14px; margin-top: 10px">
      <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: {{nextBg}}; color: {{nextFg}}; box-shadow: inset 0 0 0 1px {{nextLine}}; font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 700; font-size: 22px">{{nextCode}}</span>
      <h1 id="next-shift" style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em">{{nextTitle}}</h1>
    </div>
  </section>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 16px; height: 52px">
    <h2 style="margin: 0; font-size: 18px; font-weight: 600">October 2026</h2>
    <div style="display: flex; align-items: center; gap: 2px">
      <button type="button" aria-label="Previous month" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #C9CDD4; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </button>
      <button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #2A2F38; background: #161920; color: #ECEEF2; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Today</button>
      <button type="button" aria-label="Next month" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #C9CDD4; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </div>
  </div>

  <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding: 0 12px 6px; font-size: 12px; font-weight: 500; color: #8C93A0; text-align: center">
    <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding: 0 12px">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="35">
      <button type="button" onClick="{{d.pick}}" disabled="{{d.disabled}}" aria-label="{{d.aria}}" style="height: 80px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{d.border}}; box-shadow: inset 0 0 0 1px {{d.ring}}; background: {{d.cellBg}}; padding: 7px 0 8px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; color: {{d.numColor}}; font: inherit; cursor: pointer">
        <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: {{d.numWeight}}">{{d.num}}</span>
        <span style="width: 34px; height: 34px; box-sizing: border-box; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: {{d.chipBg}}; color: {{d.chipFg}}; box-shadow: inset 0 0 0 1px {{d.chipLine}}; font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 700; font-size: 15px">{{d.code}}</span>
        <span style="width: 5px; height: 5px; border-radius: 3px; background: {{d.dot}}"></span>
      </button>
    </sc-for>
  </div>

  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(4, 5, 7, 0.66)">
      <button type="button" aria-label="Close" onClick="{{cancel}}" style="position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; cursor: default"></button>
      <section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; background: #161920; border-top: 1px solid #2A2F38; border-radius: 22px 22px 0 0; padding: 10px 16px 28px; display: flex; flex-direction: column; gap: 18px">
        <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #3A404B"></span>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h2 id="sheet-title" style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em">{{sheetTitle}}</h2>
          <p style="margin: 0; font-size: 14px; color: #9AA1AD">{{sheetSub}}</p>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px">
          <div role="group" aria-label="Shift" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{codeButtons}}" as="b" hint-placeholder-count="5">
              <button type="button" onClick="{{b.pick}}" aria-pressed="{{b.pressed}}" style="height: 72px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid {{b.line}}; background: {{b.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: inherit; cursor: pointer; padding: 0">
                <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 700; font-size: 20px; color: {{b.fg}}">{{b.key}}</span>
                <span style="font-size: 12px; font-weight: 500; color: {{b.labelColor}}">{{b.label}}</span>
              </button>
            </sc-for>
          </div>
          <p style="margin: 0; font-size: 13px; color: #9AA1AD">To remove a shift, set it to Day off.</p>
        </div>
        <sc-if value="{{showOther}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center; gap: 14px">
            <input id="shift-code" type="text" maxlength="2" autocapitalize="characters" autocomplete="off" spellcheck="false" value="{{otherDraft}}" onChange="{{onOther}}" placeholder="SE" style="flex: none; width: 76px; height: 52px; box-sizing: border-box; border-radius: 12px; border: 1.5px solid #4A5E22; background: #232E0C; color: #C8EC72; padding: 0; text-align: center; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 22px; font-weight: 700; letter-spacing: 0.04em">
            <label for="shift-code" style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 14px; font-weight: 500; color: #C9CDD4">Code</span>
              <span style="font-size: 13px; color: #9AA1AD">1–2 letters, as on your roster</span>
            </label>
          </div>
        </sc-if>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="shift-note" style="font-size: 14px; font-weight: 500; color: #C9CDD4">Note</label>
          <input id="shift-note" type="text" value="{{noteDraft}}" onChange="{{onNote}}" placeholder="e.g. swapped with Sam" style="height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid #2E333C; background: #0E1014; color: #ECEEF2; padding: 0 14px; font: inherit; font-size: 16px">
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <button type="button" onClick="{{cancel}}" style="height: 52px; border-radius: 14px; border: 1px solid #2E333C; background: transparent; color: #ECEEF2; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">Cancel</button>
          <button type="button" onClick="{{save}}" disabled="{{saveDisabled}}" style="height: 52px; border-radius: 14px; border: 0; background: #ECEEF2; color: #0E1014; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; opacity: {{saveOpacity}}">Save</button>
        </div>
      </section>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sync":{"editor":"enum","options":["synced","pending","offline","signin"],"default":"synced"},"openDate":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const WD = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const WDL = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    const CODES = {
      D: { label: 'Day', bg: '#3B2A0A', fg: '#FCC35A', line: '#3B2A0A' },
      E: { label: 'Early', bg: '#0A2C3D', fg: '#7DD3FC', line: '#0A2C3D' },
      L: { label: 'Late', bg: '#2A1C47', fg: '#C9B6FD', line: '#2A1C47' },
      N: { label: 'Night', bg: '#1B2050', fg: '#A5B1FF', line: '#1B2050' },
      X: { label: 'Day off', bg: 'transparent', fg: '#8C93A0', line: '#3A404B' }
    };
    const OTHER = { label: 'Other', bg: '#232E0C', fg: '#C8EC72', line: '#232E0C' };
    const info = (k) => CODES[k] || OTHER;
    const INITIAL = { 1: 'D', 2: 'D', 3: 'X', 4: 'X', 5: 'E', 6: 'E', 7: 'L', 8: 'L', 9: 'X', 10: 'N', 11: 'N', 12: 'N', 13: 'X', 14: 'X', 15: 'X', 16: 'L', 17: 'L', 18: 'X', 19: 'E', 20: 'E', 21: 'D', 22: 'D', 23: 'SE', 24: 'N', 25: 'N', 26: 'N', 27: 'X', 28: 'X' };
    const NOTES = { 22: 'Swapped with Sam' };
    const SYNC = {
      synced: { label: 'Synced', dot: '#34D399', ring: '#34D399' },
      pending: { label: '2 pending', dot: '#F5A524', ring: '#F5A524' },
      offline: { label: 'Offline', dot: 'transparent', ring: '#8C93A0' },
      signin: { label: 'Sign in needed', dot: '#FB7185', ring: '#FB7185' }
    };
    const TODAY = 15;
    const wd = (d) => (3 + d - 1) % 7;

    const s = this.state || {};
    const p = this.props || {};
    const shifts = s.shifts || INITIAL;
    const notes = s.notes || NOTES;
    const labelOf = (k) => (CODES[k] ? CODES[k].label : 'Other · ' + k);
    const editing = s.editing !== undefined ? s.editing : (p.openDate ? Number(p.openDate) : null);
    const pendingCount = s.pendingCount || 0;
    const syncKey = SYNC[p.sync] ? p.sync : 'synced';
    let sync = SYNC[syncKey];
    if (syncKey === 'synced' && pendingCount > 0) sync = { label: pendingCount + ' pending', dot: '#F5A524', ring: '#F5A524' };

    const blank = (n) => ({ num: n, aria: 'Outside October', disabled: true, pick: () => {}, cellBg: 'transparent', border: 'transparent', ring: 'transparent', numColor: '#4B515C', numWeight: 500, chipBg: 'transparent', chipFg: 'transparent', chipLine: 'transparent', code: '', dot: 'transparent' });
    const days = [blank(28), blank(29), blank(30)];
    for (let d = 1; d <= 31; d++) {
      const k = shifts[d];
      const c = k ? info(k) : null;
      const isToday = d === TODAY;
      const isEditing = d === editing;
      days.push({
        num: d,
        disabled: false,
        aria: WD[wd(d)] + ' ' + d + ' October, ' + (c ? labelOf(k) : 'no shift') + (notes[d] ? ', has note' : '') + (isToday ? ', today' : ''),
        pick: () => this.setState({ editing: d, draftCode: undefined, noteDraft: undefined, otherDraft: undefined }),
        cellBg: isToday ? '#161920' : '#121418',
        border: isToday || isEditing ? '#ECEEF2' : '#1C2027',
        ring: isToday ? '#ECEEF2' : 'transparent',
        numColor: isToday ? '#ECEEF2' : (d < TODAY ? '#737B88' : '#C9CDD4'),
        numWeight: isToday ? 700 : 500,
        chipBg: c ? c.bg : 'transparent',
        chipFg: c ? c.fg : 'transparent',
        chipLine: c ? c.line : 'transparent',
        code: k || '',
        dot: notes[d] ? '#ECEEF2' : 'transparent'
      });
    }
    days.push(blank(1));

    let next = null;
    for (let d = TODAY; d <= 31; d++) { const k = shifts[d]; if (k && k !== 'X') { next = d; break; } }
    const nc = next !== null ? info(shifts[next]) : null;
    const when = next === null ? '' : (next === TODAY ? 'Today' : next === TODAY + 1 ? 'Tomorrow' : WD[wd(next)] + ' ' + next + ' Oct');

    const sheetOpen = editing !== null && editing !== undefined;
    const cur = sheetOpen ? shifts[editing] : undefined;
    const draftCode = s.draftCode !== undefined ? s.draftCode : (cur ? (CODES[cur] ? cur : 'O') : undefined);
    const noteDraft = s.noteDraft !== undefined ? s.noteDraft : (sheetOpen ? (notes[editing] || '') : '');
    const otherDraft = s.otherDraft !== undefined ? s.otherDraft : (cur && !CODES[cur] ? cur : '');
    const finalCode = draftCode === 'O' ? otherDraft : draftCode;
    const codeButtons = ['D', 'E', 'L', 'N', 'X', 'O'].map((k) => {
      const c = k === 'O' ? OTHER : CODES[k];
      const on = draftCode === k;
      return {
        key: k === 'O' ? (otherDraft || '··') : k, label: c.label, pressed: on, fg: c.fg,
        bg: on ? (k === 'X' ? '#22262E' : c.bg) : '#1A1D24',
        line: on ? c.fg : '#2A2F38',
        labelColor: on ? '#ECEEF2' : '#9AA1AD',
        pick: () => this.setState({ draftCode: k })
      };
    });

    return {
      syncLabel: sync.label, syncDot: sync.dot, syncRing: sync.ring,
      showBanner: syncKey === 'signin',
      nextCode: nc ? shifts[next] : '–',
      nextBg: nc ? nc.bg : '#161920', nextFg: nc ? nc.fg : '#8C93A0', nextLine: nc ? nc.line : '#2A2F38',
      nextTitle: nc ? when + ' · ' + labelOf(shifts[next]) : 'No upcoming shifts',
      days,
      sheetOpen,
      sheetTitle: sheetOpen ? WDL[wd(editing)] + ' ' + editing + ' October' : '',
      sheetSub: sheetOpen ? (shifts[editing] ? 'Currently ' + labelOf(shifts[editing]) : 'Not rostered yet') : '',
      codeButtons,
      noteDraft,
      onNote: (e) => this.setState({ noteDraft: e.target.value }),
      showOther: draftCode === 'O',
      otherDraft,
      onOther: (e) => this.setState({ otherDraft: String(e.target.value).toUpperCase().replace(/[^A-Z]/g, '').slice(0, 2) }),
      saveDisabled: !finalCode,
      saveOpacity: finalCode ? 1 : 0.4,
      cancel: () => this.setState({ editing: null, draftCode: undefined, noteDraft: undefined, otherDraft: undefined }),
      save: () => {
        if (!finalCode) return;
        const ns = Object.assign({}, shifts); ns[editing] = finalCode;
        const nn = Object.assign({}, notes);
        if (noteDraft) nn[editing] = noteDraft; else delete nn[editing];
        this.setState({ shifts: ns, notes: nn, editing: null, draftCode: undefined, noteDraft: undefined, otherDraft: undefined, pendingCount: pendingCount + 1 });
        if (syncKey === 'synced') {
          clearTimeout(this._t);
          this._t = setTimeout(() => this.setState({ pendingCount: 0 }), 1600);
        }
      }
    };
  }
}
</script>
</body>
</html>
