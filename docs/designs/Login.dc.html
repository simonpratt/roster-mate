<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roster Mate — Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1014; color: #ECEEF2; color-scheme: dark; font-family: 'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column; padding: 96px 24px 40px">

  <div style="display: flex; flex-direction: column; gap: 20px">
    <svg width="56" height="56" viewBox="0 0 30 30" aria-hidden="true">
      <rect x="1" y="1" width="28" height="28" rx="8" fill="#161920" stroke="#2A2F38"></rect>
      <rect x="7" y="7" width="7" height="7" rx="2" fill="#FCC35A"></rect>
      <rect x="16" y="7" width="7" height="7" rx="2" fill="#7DD3FC"></rect>
      <rect x="7" y="16" width="7" height="7" rx="2" fill="#C9B6FD"></rect>
      <rect x="16" y="16" width="7" height="7" rx="2" fill="none" stroke="#5A616D" stroke-width="1.5"></rect>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em">Roster Mate</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.45; color: #9AA1AD">Your shifts, on your phone.</p>
    </div>
  </div>

  <form style="display: flex; flex-direction: column; gap: 18px; margin-top: 48px">
    <sc-if value="{{showError}}" hint-placeholder-val="{{ false }}">
      <p role="alert" style="margin: 0; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #2A1418; border: 1px solid #4A1F27; color: #FBD5DB; font-size: 14px; line-height: 1.4">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FB7185" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5"></path><path d="M12 16.5v.01"></path></svg>
        That username and password don’t match.
      </p>
    </sc-if>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="username" style="font-size: 14px; font-weight: 500; color: #C9CDD4">Username</label>
      <input id="username" type="text" autocomplete="username" autocapitalize="none" value="{{username}}" onChange="{{onUser}}" style="height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{fieldLine}}; background: #161920; color: #ECEEF2; padding: 0 14px; font: inherit; font-size: 16px">
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="password" style="font-size: 14px; font-weight: 500; color: #C9CDD4">Password</label>
      <input id="password" type="password" autocomplete="current-password" value="{{password}}" onChange="{{onPass}}" style="height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{fieldLine}}; background: #161920; color: #ECEEF2; padding: 0 14px; font: inherit; font-size: 16px">
    </div>
    <a href="Main.dc.html" style="margin-top: 8px; height: 54px; border-radius: 14px; background: #ECEEF2; color: #0E1014; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Sign in</a>
  </form>

  <p style="margin: auto 0 0; font-size: 13px; line-height: 1.5; color: #8C93A0; text-align: center">Once you’ve signed in, your shifts stay on this phone and work offline.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showError":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const p = this.props || {};
    const showError = p.showError === true || p.showError === 'true';
    return {
      showError,
      fieldLine: showError ? '#4A1F27' : '#2E333C',
      username: s.username !== undefined ? s.username : (showError ? 'alex' : ''),
      password: s.password !== undefined ? s.password : (showError ? 'wrongpass' : ''),
      onUser: (e) => this.setState({ username: e.target.value }),
      onPass: (e) => this.setState({ password: e.target.value })
    };
  }
}
</script>
</body>
</html>
