# CI for Roster Mate: a Go server with an embedded React web app, and a Playwright
# suite in test/e2e.
#
# checks, e2e and smoke run in parallel. checks runs gofmt and `make test` (go vet,
# go test, the web and e2e type-checks and Vitest). e2e runs `make e2e`: the full
# Playwright suite on a phone viewport against the web app and binary it builds
# from source, in test mode with the fake Claude. smoke builds the linux/amd64
# image, runs it with a named /data volume and runs the @smoke tests against the
# container (`make e2e-smoke`), then checks that no secret reached `docker logs`.
# publish waits for all three, then builds linux/amd64 and linux/arm64 in one step
# (Go cross-compiles in the Dockerfile, so no QEMU) with the amd64 layers from
# smoke's cache. It pushes to GHCR on master and v* tags; pull requests only
# build.
#
# Tags: master → :latest + :sha-<short>; tag vX.Y.Z → :X.Y.Z + :sha-<short>.
#
# Actions are on their major version tags; Dependabot (.github/dependabot.yml)
# raises a PR when a new major comes out.
name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/roster-mate

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # No version: it installs the one pinned by packageManager in the root package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      # Installs node_modules with pnpm install --frozen-lockfile, then go vet, go test, typecheck, Vitest.
      - run: make test

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # No version: it installs the one pinned by packageManager in the root package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: playwright
        name: Playwright version
        run: echo "version=$(pnpm --filter ./test/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter ./test/e2e exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter ./test/e2e exec playwright install-deps chromium

      # Builds the web app and bin/roster-mate, then Playwright's webServer starts them in test
      # mode on :18080 with the fake Claude on :18081.
      - name: Full e2e suite
        run: make e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: |
            test/e2e/test-results/
            test/e2e/playwright-report/
          retention-days: 7

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: roster-mate:smoke
          cache-from: |
            type=gha,scope=smoke
            type=gha,scope=publish
          cache-to: type=gha,scope=smoke,mode=max

      # A fresh named volume proves the non-root user can write /data: with
      # SESSION_SECRET unset, startup generates one and stores it in the database.
      - name: Start image
        run: |
          docker run -d --name app -p 8080:8080 -v roster-mate-data:/data \
            -e APP_USERNAME=e2e -e APP_PASSWORD=e2e-password \
            -e ANTHROPIC_API_KEY=sk-ant-smoke -e ROSTER_NAME=Smoke \
            roster-mate:smoke
          curl --silent --fail --retry 30 --retry-delay 1 --retry-all-errors http://localhost:8080/api/health > /dev/null

      # No version: it installs the one pinned by packageManager in the root package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: playwright
        name: Playwright version
        run: echo "version=$(pnpm --filter ./test/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter ./test/e2e exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter ./test/e2e exec playwright install-deps chromium

      # Signs in as e2e/e2e-password (the test/e2e defaults) at http://localhost:8080.
      - name: Smoke tests against the image
        run: make e2e-smoke

      - name: No secrets in the logs
        run: |
          if docker logs app 2>&1 | grep -q -F -e e2e-password -e sk-ant-smoke; then
            echo "docker logs contain a secret" >&2
            exit 1
          fi

      - name: Image logs
        if: failure()
        run: docker logs app

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-results
          path: |
            test/e2e/test-results/
            test/e2e/playwright-report/
          retention-days: 7

  publish:
    needs: [checks, e2e, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      # The amd64 layers come from smoke's cache, so this is the image that
      # was smoke-tested.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: |
            type=gha,scope=smoke
            type=gha,scope=publish
          cache-to: type=gha,scope=publish,mode=max
