# CI for Roster Mate: a Go server with an embedded React web app.
#
# checks and smoke run in parallel. checks runs gofmt and `make test` (go vet,
# go test, the web type-check and Vitest). smoke builds the linux/amd64 image,
# runs it and curls the key routes: health, the embedded web app, and a login
# that opens a session. There is no e2e job: the repo has no e2e suite yet.
# publish waits for both, then builds linux/amd64 and linux/arm64 in one step
# (Go cross-compiles in the Dockerfile, so no QEMU) with the amd64 layers from
# smoke's cache. It pushes to GHCR on master and v* tags; pull requests only
# build.
#
# Tags: master → :latest + :sha-<short>; tag vX.Y.Z → :X.Y.Z + :sha-<short>.
#
# Actions are on their major version tags; Dependabot (.github/dependabot.yml)
# raises a PR when a new major comes out.
name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/roster-mate

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # No version: it installs the one pinned by packageManager in web/package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: gofmt
        working-directory: server
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      # Installs web/node_modules with pnpm install --frozen-lockfile, then go vet, go test, typecheck, Vitest.
      - run: make test

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: roster-mate:smoke
          cache-from: |
            type=gha,scope=smoke
            type=gha,scope=publish
          cache-to: type=gha,scope=smoke,mode=max

      # A fresh named volume proves the non-root user can write /data: with
      # SESSION_SECRET unset, startup generates one and stores it in the database.
      - name: Start image
        run: |
          docker run -d --name app -p 8080:8080 -v roster-mate-data:/data \
            -e APP_USERNAME=smoke -e APP_PASSWORD=smoke \
            -e ANTHROPIC_API_KEY=sk-ant-smoke -e ROSTER_NAME=Smoke \
            roster-mate:smoke
          curl --silent --fail --retry 30 --retry-delay 1 --retry-all-errors http://localhost:8080/api/health > /dev/null

      - name: Smoke tests against the image
        run: |
          curl --silent --fail http://localhost:8080/ | grep -q '<div id="root">'
          curl --silent --fail --cookie-jar cookies -H 'Content-Type: application/json' \
            -d '{"username":"smoke","password":"smoke"}' http://localhost:8080/api/login
          curl --silent --fail --cookie cookies http://localhost:8080/api/session | grep -q '"smoke"'

      - name: Image logs
        if: failure()
        run: docker logs app

  publish:
    needs: [checks, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      # The amd64 layers come from smoke's cache, so this is the image that
      # was smoke-tested.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: |
            type=gha,scope=smoke
            type=gha,scope=publish
          cache-to: type=gha,scope=publish,mode=max
